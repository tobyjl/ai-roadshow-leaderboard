<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.ON Next Roadshow — Live Timer</title>
    <link rel="stylesheet" href="brand.css">
    <link rel="stylesheet" href="timer.css">
</head>
<body class="phase-idle">
    <!-- Full-screen flash overlay for phase changes -->
    <div id="flash-overlay" class="flash-overlay"></div>

    <div class="timer-layout">
        <!-- Slim brand header -->
        <header class="timer-header">
            <img src="eon_next_logo.png" alt="E.ON Next" class="timer-logo" onerror="this.style.display='none'">
            <div class="timer-header-title">Roadshow live</div>
            <div class="timer-header-actions">
                <button id="reveal-btn" class="header-btn reveal-header-btn">🎭 Reveal scores</button>
                <button id="voice-btn" class="header-btn">🔊 Voice on</button>
                <a href="presentation.html" class="header-btn">🎬 Presentation</a>
            </div>
        </header>

        <main class="timer-main">
            <!-- LEFT: The big timer -->
            <section class="timer-stage">
                <div id="phase-label" class="phase-label">Welcome to the AI Roadshow, Nottingham!</div>
                <div id="phase-sub" class="phase-sub">Press start to open the 7:30 arrival window</div>

                <div id="clock" class="clock">7:30</div>

                <!-- Per-team assignments: stall occupancy during a round, or moves during transit -->
                <div id="assignments" class="assignments"></div>

                <!-- Journey progress: 4 rounds linked by 3 rotations -->
                <div class="journey" id="journey">
                    <div class="stop" data-round="1"><span class="stop-dot">1</span><span class="stop-name">Round 1</span></div>
                    <div class="leg" data-after="1"></div>
                    <div class="stop" data-round="2"><span class="stop-dot">2</span><span class="stop-name">Round 2</span></div>
                    <div class="leg" data-after="2"></div>
                    <div class="stop" data-round="3"><span class="stop-dot">3</span><span class="stop-name">Round 3</span></div>
                    <div class="leg" data-after="3"></div>
                    <div class="stop" data-round="4"><span class="stop-dot">4</span><span class="stop-name">Round 4</span></div>
                </div>

                <div id="overall" class="overall">Total run 52:00</div>

                <!-- Operator controls -->
                <div class="controls">
                    <button id="start-btn" class="ctrl ctrl-primary">▶ Start</button>
                    <button id="reset-btn" class="ctrl ctrl-ghost">↺ Reset</button>
                    <button id="skip-btn" class="ctrl ctrl-ghost">⏭ Skip</button>
                </div>
                <div class="hint">Spacebar = start / pause</div>
            </section>

            <!-- RIGHT: Live current-session leaderboard -->
            <aside class="side-board">
                <div class="side-title">🕒 Current session</div>
                <div id="side-session" class="side-session">—</div>
                <div id="missing-flag" class="missing-flag"></div>
                <div id="score-flag" class="score-flag"></div>
                <div id="side-container">
                    <div class="loading">Loading standings…</div>
                </div>
                <div id="side-updated" class="side-updated">Last updated: —</div>
            </aside>
        </main>
    </div>

    <!-- Full-screen dramatic reveal -->
    <div id="reveal-overlay" class="reveal-overlay">
        <button id="reveal-close" class="reveal-close" title="Close">✕</button>
        <div class="reveal-inner">
            <div id="reveal-kicker" class="reveal-kicker">Session results</div>
            <div class="reveal-heading">The results are in!</div>
            <div id="reveal-list" class="reveal-list"></div>
            <button id="reveal-unhide" class="reveal-unhide">Hide scores again</button>
        </div>
    </div>

    <script src="schedule.js"></script>
    <script src="timer.js"></script>
</body>
</html>
